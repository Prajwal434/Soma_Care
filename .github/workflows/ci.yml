name: SomaCare CI - Code Quality, Security & Contract Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-security:
    name: Code Quality, Security & Contract Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Automated Test Suite (Quality, Adversarial & IoT)
        run: npm test

      - name: Verify OpenAPI 3.1.0 Contract Schema
        run: |
          node -e "
            const spec = require('./src/spec/openapi.json');
            if (!spec.openapi || !spec.paths || !spec.components) {
              console.error('Invalid OpenAPI spec');
              process.exit(1);
            }
            console.log('OpenAPI 3.1.0 Schema Verified Successfully');
          "

      - name: Production Build Check
        run: npm run build
